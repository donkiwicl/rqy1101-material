<script>
var N=["Clase de reemplazo basada en el PDA RQY1101 (Ingeniería de Requisitos). El contenido corresponde al IL 1.1: determinar diferencias entre metodologías ágiles y predictivas. La clase avanza desde el contexto histórico, pasa por el Manifiesto Ágil y termina con el funcionamiento de Scrum y una actividad práctica.","Presentar los tres objetivos y conectarlos con el indicador de logro del PDA. Recomendación: pedir a los estudiantes que, al final, se autoevalúen contra estos tres verbos.","Dejar 5 minutos para que respondan en parejas y luego recoger 2 o 3 ideas en voz alta. No hay respuestas incorrectas: el objetivo es que sientan el problema que la agilidad intenta resolver. Volver a estas ideas al presentar el Manifiesto Ágil.","Línea de tiempo tomada del material del PDA (sesión 1.2). Idea central: la demanda de software creció, los proyectos fallaban y primero se respondió con procesos formales y predictivos. En 2001 un grupo de desarrolladores propone una alternativa: el Manifiesto Ágil.","El enfoque predictivo imita la ingeniería de otros campos, como la construcción. Pregunta para el curso: ¿qué pasa si nos piden varios cambios a la mitad o al final del proyecto? Es el puente hacia la agilidad. Importante: cascada no es un enfoque equivocado; se sigue usando cuando el contexto lo justifica.","En cascada el ciclo de vida se ejecuta una sola vez; en agilidad se repite tantas veces como sea necesario. Cada vuelta entrega algo que funciona, y con eso se recibe retroalimentación real del usuario. Los incrementos se acumulan hacia el objetivo del producto.","Los cuatro valores del Manifiesto para el Desarrollo Ágil de Software (Beck et al., 2001). Aclarar el error más común: ágil no significa «sin documentación» ni «sin planificación»; significa priorizar lo de la izquierda cuando hay que elegir. Conectar con la actividad inicial: responder al cambio sobre seguir un plan.","Los 12 principios del Manifiesto agrupados en 6 ideas para no leerlos uno por uno. Si quedan minutos, invitar a los estudiantes a revisar el texto completo en agilemanifesto.org. Los principios están detrás de cada práctica de Scrum que veremos después.","Cierre de la parte conceptual de metodologías. El PDA enfatiza no ser fanático de una herramienta: se elige según el contexto. La fila «Se elige cuando» responde directamente al IL 1.1.","Tabla tomada del material del PDA (sesión 1.2). Es el punto donde la agilidad toca directamente la ingeniería de requisitos: en ágil, el desarrollo de requisitos se ejecuta muchas veces a lo largo del proyecto y no solo una vez.","Definición tomada del material del PDA (sesión 2.3) y de la Guía de Scrum 2020. Scrum es el marco ágil más popular y extendido, pero existen otros. Los tres pilares del empirismo: transparencia (lo importante es visible), inspección (se revisa con frecuencia) y adaptación (se ajusta cuando algo se desvía).","Mapa general antes de entrar al detalle. Roles: quiénes. Eventos: cuándo se colabora. Artefactos: qué se produce y se hace visible. El refinamiento del Product Backlog se verá junto a los eventos, aunque la Guía de Scrum 2020 lo trata como una actividad continua y no como un evento formal.","Roles según el material del PDA y la Guía de Scrum 2020 (que habla de Developers). En el semestre cada grupo de tres personas asume estos tres roles; el Scrum Master suele ser quien administra el proyecto en Jira. Pregunta rápida: ¿quién decide el orden del backlog? El Product Owner.","El sprint contiene a todos los demás eventos. Mostrar el flujo de izquierda a derecha y luego «cerrar el círculo»: la retrospectiva alimenta al siguiente sprint. El PDA propone sprints de 2 a 4 semanas; en el proyecto semestral se usa un sprint de 3 semanas. La Guía de Scrum fija un máximo de un mes.","Los topes de tiempo (8 h, 15 min, 4 h y 3 h) son máximos para un sprint de un mes; en sprints más cortos los eventos duran menos. La Daily Scrum es solo para el equipo de desarrollo. El refinamiento no tiene duración fija: ocurre de forma continua durante el sprint.","Cada artefacto tiene un compromiso asociado que le da foco: Product Goal para el backlog del producto, Sprint Goal para el backlog del sprint y Definition of Done para el incremento. Conexión con la asignatura: los requisitos funcionales se expresan como historias de usuario con criterios de aceptación, y los no funcionales viven en el Definition of Done.","Ejemplo ilustrativo construido a partir de los requisitos del caso «Tiendas Urbano» de la actividad 1.1. La prioridad la decide el Product Owner según el valor para el negocio y el usuario. Pregunta para el curso: ¿qué historias entrarían en el primer sprint si solo cabe una parte?","Actividad práctica de unos 20 minutos, ajustable al tiempo disponible. Las ideas de proyecto provienen de los enunciados sugeridos en la orientación para el docente del PDA. Circular por los grupos y verificar que las historias sigan el formato Como-quiero-para y que el objetivo del sprint sea una sola frase.","Cerrar con las cuatro ideas y volver a la pregunta inicial: ¿cómo debió organizarse el proyecto para absorber el cambio? Con las ideas de hoy, los estudiantes deberían poder responder desde la agilidad y Scrum.","Pedir el ticket de salida por escrito o por el chat del curso. Sirve como evidencia rápida del IL 1.1: el estudiante debe justificar la elección según el contexto (requisitos estables y tecnología conocida frente a incertidumbre y cambios). Wiegers y Beatty es la bibliografía indicada en el PDA para las sesiones 1.1 y 1.2."];
var i=0,img=document.getElementById('s'),cnt=document.getElementById('cnt'),nt=document.getElementById('notes');
function show(k){i=Math.max(0,Math.min(19,k));img.src='slides/slide_'+String(i+1).padStart(2,'0')+'.png';img.alt='Diapositiva '+(i+1);cnt.textContent=(i+1)+' / 20';nt.textContent=N[i];location.hash=i+1}
document.getElementById('prev').onclick=function(){show(i-1)};
document.getElementById('nxt').onclick=function(){show(i+1)};
document.getElementById('tn').onclick=function(){nt.style.display=nt.style.display==='block'?'none':'block'};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')show(i+1);if(e.key==='ArrowLeft')show(i-1)});
var h=parseInt(location.hash.slice(1));show(isNaN(h)?0:h-1);
</script></body></html>
